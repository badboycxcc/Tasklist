<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f16"/>
      <stop offset="1" stop-color="#0e1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="70" r="280" fill="#22d3ee" opacity="0.07"/>
  <circle cx="110" cy="580" r="260" fill="#a78bfa" opacity="0.07"/>

  <!-- logo -->
  <rect x="80" y="62" width="84" height="84" rx="20" fill="#0f1721" stroke="url(#accent)" stroke-width="4"/>
  <path d="M104 86l18 18-18 18" stroke="url(#accent)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M132 122h24" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>

  <text x="192" y="104" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="42" font-weight="700" fill="#e6eef8">TaskList Inspector</text>
  <text x="192" y="140" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="22" fill="#93a6bd">在线进程分析 · Online Process Analyzer</text>

  <!-- headline -->
  <text x="80" y="268" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" fill="#e6eef8">粘贴进程列表，一键识别目标软件环境</text>
  <text x="82" y="322" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="25" fill="#93a6bd">tasklist / ps aux / NetExec logs  →  AV·EDR · Remote Tools · Tunnels · Databases</text>

  <!-- chips -->
  <g font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="23" fill="#a5f3fc">
    <rect x="80" y="380" width="232" height="56" rx="28" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="104" y="417">杀软 / EDR 识别</text>

    <rect x="328" y="380" width="264" height="56" rx="28" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="352" y="417">远控 / 隧道 / VPN</text>

    <rect x="608" y="380" width="256" height="56" rx="28" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="632" y="417">数据库 / Web 服务</text>

    <rect x="880" y="380" width="244" height="56" rx="28" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="904" y="417">命令行关键字识别</text>

    <rect x="80" y="452" width="300" height="56" rx="28" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.40"/>
    <text x="104" y="489" fill="#ddd6fe">中英双语 · 可离线使用</text>

    <rect x="396" y="452" width="276" height="56" rx="28" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.40"/>
    <text x="420" y="489" fill="#ddd6fe">纯前端 · 数据不上传</text>

    <rect x="688" y="452" width="296" height="56" rx="28" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.40"/>
    <text x="712" y="489" fill="#ddd6fe">自动清洗 NetExec 前缀</text>
  </g>

  <!-- bottom -->
  <text x="80" y="586" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#22d3ee">tasklist.cxaqhq.cn</text>
  <text x="1120" y="586" text-anchor="end" font-family="PingFang SC, Helvetica Neue, Arial, sans-serif" font-size="21" fill="#64748b">github.com/badboycxcc/Tasklist</text>
</svg>
